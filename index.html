            } catch (error) {
                console.warn('No se pudo conectar. Usando datos offline.', error);
                if (!cached) {
                    resultsContainer.innerHTML = `<div class="no-results">Error de conexión.<small>Conéctate a internet al menos una vez.</small></div>`;
                    lastUpdatedEl.innerText = "Error de conexión";
                }
            }
        }

        loadData();
    </script>
</body>
</html>
